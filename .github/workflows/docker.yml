name: Docker build

# Catches Dockerfile rot without paying the build cost on every PR: this
# workflow only triggers when container files or dependency manifests change.
# PR-only by design — the PR is the gate to main, so the size budget + boot
# smoke run before every merge, and cd.yml owns the build+push on main (running
# both here would build the backend image twice per container-touching merge).
on:
  pull_request:
    paths:
      - "**/Dockerfile*"
      - "docker-compose*.yml"
      - "backend/pyproject.toml"
      # The image is built *from* the lock, so a lock-only change (e.g. a
      # regenerated pin set) must re-run the container build + smoke test.
      - "backend/requirements.lock"
      - "frontend/package-lock.json"
      # Owns the frontend build's output mode and directory (`output: "export"`
      # → out/), which is what both frontend images COPY.
      - "frontend/next.config.ts"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: builds images and smoke-tests them, never writes to the repo.
permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (no push)
        run: docker build -t screener-backend backend
      - name: Assert backend image size < 300MB
        # Acceptance criterion for #11 — a slim runtime is the whole point of
        # the multi-stage build, so guard against regressions here. We measure
        # the compressed (pushed/pulled) size: it's the number that matters for
        # the GHCR registry and #13's rollout, and `docker save | gzip` gives a
        # deterministic result regardless of the runner's image-store backend
        # (`docker image inspect .Size` reports uncompressed on the classic
        # store but compressed on containerd — not portable).
        run: |
          bytes=$(docker save screener-backend | gzip -c | wc -c)
          mb=$((bytes / 1024 / 1024))
          echo "backend image (compressed): ${mb}MB"
          if [ "$mb" -ge 300 ]; then
            echo "::error::backend image ${mb}MB exceeds the 300MB budget"
            exit 1
          fi
      - name: Smoke-test backend boots and serves /health
        # `docker build` above proves the image *builds*, but a missing runtime
        # dependency or an unwritable DB path only surfaces at *startup*, which a
        # build never exercises — exactly how the aiosqlite crash and the
        # root-owned /app path reached a green CI. Boot the real compose service
        # (--no-deps skips the ~4.7GB ollama pull; startup builds no LLM client)
        # and probe /health. compose reuses the layer cache from the build above.
        run: |
          docker compose up -d --no-deps backend
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::backend did not become healthy within 60s"
            docker compose logs backend
            docker compose down -v
            exit 1
          fi
          echo "backend healthy"
          docker compose down -v
      - name: Build frontend image (no push)
        run: docker build -t screener-frontend frontend
      - name: Smoke-test frontend serves the export
        # The nginx config resolves its upstream per request, so the image boots
        # and serves the app with no backend present — which makes this a pure
        # test of the static-serving half: the exported home route, a genuine 404
        # for an unexported path (`try_files ... =404` + error_page), and a CSP
        # that permits the inline RSC payload scripts a Next export ships. That
        # last one has no other guard: tighten script-src and every page still
        # returns 200 while the app silently never hydrates.
        run: |
          docker run -d --name fe -p 8080:80 screener-frontend
          ok=0
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::frontend did not serve / within 30s"
            docker logs fe; docker rm -f fe; exit 1
          fi
          fail() { echo "::error::$1"; docker logs fe; docker rm -f fe; exit 1; }
          curl -fsS http://localhost:8080/ | grep -q "TrialGate" \
            || fail "home route did not render the app shell"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nope)" = 404 ] \
            || fail "unexported path did not 404"
          curl -sI http://localhost:8080/ | grep -i content-security-policy \
            | grep -q "script-src 'self' 'unsafe-inline'" \
            || fail "CSP no longer allows the export's inline RSC scripts — the app would not hydrate"
          echo "frontend healthy"
          docker rm -f fe
