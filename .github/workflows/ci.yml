name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on force-push / rapid pushes to the same ref, but
# never cancel main builds mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: this workflow only reads the repo. Installing deps runs
# untrusted transitive code, so don't hand it a write-capable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # CHECKPOINT_BACKEND=postgres is the multi-replica production target, and
    # without a database here every `Postgres*Store` is code the suite imports and
    # never runs — sqlite's twin passing proves nothing about the statements the
    # two engines spell differently (ON CONFLICT vs OR IGNORE, ADD COLUMN IF NOT
    # EXISTS vs PRAGMA introspection, and postgres's refusal to assign a boolean
    # to an integer column). `tests/test_persistence_postgres.py` skips itself
    # when POSTGRES_TEST_DSN is unset, so a developer's `pytest` still needs no
    # database; this is what makes CI the place those tests actually run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: trialgate
          POSTGRES_DB: trialgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Lock drift check (requirements.lock ⇄ pyproject.toml)
        # The Docker image installs from requirements.lock, but this job installs
        # from pyproject.toml — so a lock that has drifted out of sync (e.g. a
        # newly-added dep never compiled in) stays invisible to the test suite.
        # That gap shipped the aiosqlite/lockfile startup crash. Regenerate the
        # lock and fail on any diff. Reproducible because: Python 3.11 (matching
        # the runtime image), pinned pip-tools, and no --upgrade (existing pins
        # are preserved, so this only reacts to real pyproject changes).
        #
        # pip is pinned alongside pip-tools, not incidentally: pip-compile drives
        # pip's *internals*, which carry no compatibility guarantee, so the
        # runner's preinstalled pip is a silent input to a step whose whole point
        # is reproducibility. Leaving it floating broke this step on every branch
        # at once when the runner moved to pip 26 and `stdlib_pkgs` left
        # `pip._internal.utils.compat`. Bump the two together, and only together.
        run: |
          pip install pip==26.2.1 pip-tools==7.6.1
          pip-compile --quiet --output-file=requirements.lock --strip-extras pyproject.toml
          if ! git diff --exit-code requirements.lock; then
            echo "::error file=backend/requirements.lock::requirements.lock is out of sync with pyproject.toml. Regenerate: cd backend && pip-compile --output-file=requirements.lock --strip-extras pyproject.toml"
            exit 1
          fi
      - name: Install
        # The `postgres` extra too: it is optional for a sqlite deployment, but
        # without psycopg installed the postgres suite would skip here for the
        # wrong reason — a missing import rather than a missing database.
        run: pip install -e ".[dev,postgres]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Format check (ruff)
        run: ruff format --check app tests
      - name: Typecheck (mypy)
        run: mypy
      - name: Tests + coverage
        # Coverage floor lives in pyproject ([tool.coverage.report] fail_under)
        # so it is one source of truth; #9 raises it to 80 once tests land.
        #
        # POSTGRES_TEST_DSN is what un-skips tests/test_persistence_postgres.py
        # against the service container above. Set here rather than in the file's
        # own default so the suite stays opt-in everywhere else — a developer who
        # has no postgres running gets skips, not failures.
        env:
          POSTGRES_TEST_DSN: postgresql://postgres:trialgate@localhost:5432/trialgate_test
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Format check (prettier)
        run: npm run format:check
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build (next export)
        # Both container images COPY frontend/out — `next build` exiting 0 is not
        # enough, the static export has to actually be there. A missing
        # out/index.html means `output: "export"` was dropped from next.config.ts,
        # which would break the image builds instead of this job.
        #
        # The per-route directories are asserted too: `trailingSlash: true` is what
        # makes both static hosts resolve /runs → /runs/index.html. Drop it and
        # every sidebar destination 404s in the containers while this job, and
        # `next dev`, stay green.
        run: |
          npm run build
          test -f out/index.html
          for route in runs runs/view review review/edit rules metrics audit design; do
            test -f "out/$route/index.html" || {
              echo "::error::out/$route/index.html missing — trailingSlash or the route is gone"
              exit 1
            }
          done
